        // --- 線性迴歸計算函數 ---
        const calculateLinearRegression = (data, xKey = 'damage', yKey = 'time') => {
            if (data.length < 2) return null;

            const n = data.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;

            data.forEach(d => {
                const x = d[xKey];
                const y = d[yKey];
                sumX += x;
                sumY += y;
                sumXY += x * y;
                sumX2 += x * x;
            });

            const denominator = (n * sumX2 - sumX * sumX);
            if (denominator === 0) return null; // 防止垂直線導致的除以零

            const slope = (n * sumXY - sumX * sumY) / denominator;
            const intercept = (sumY - slope * sumX) / n;

            // 計算 R² (決定係數)
            const yMean = sumY / n;
            let ssTotal = 0, ssResidual = 0;
            data.forEach(d => {
                const y = d[yKey];
                const yPredicted = slope * d[xKey] + intercept;
                ssTotal += Math.pow(y - yMean, 2);
                ssResidual += Math.pow(y - yPredicted, 2);
            });

            // 如果 ssTotal 為 0，代表所有 Y 值(時間)相等
            // 若回歸預測也完全精準(ssResidual=0)則 R2 為 1，否則為 0
            const rSquared = ssTotal === 0 ? (ssResidual === 0 ? 1 : 0) : 1 - (ssResidual / ssTotal);

            // 計算趨勢線的起點和終點
            const xValues = data.map(d => d[xKey]);
            const minX = Math.min(...xValues);
            const maxX = Math.max(...xValues);

            return {
                slope,
                intercept,
                rSquared: Math.max(0, Math.min(1, rSquared)), // 強制限制在 0~1 區間
                startPoint: { x: minX, y: slope * minX + intercept },
                endPoint: { x: maxX, y: slope * maxX + intercept },
                // 性價比指標：斜率越負 = 傷害轉換效率越高
                efficiency: -slope * 100 // 每100點傷害減少的時間（分鐘）
            };
        };

        // 計算所有職業的趨勢線數據
        const calculateAllTrendLines = () => {

                if (jobData.length >= 2) {

                }

        };

        // 計算雙軸職業專用趨勢線（時間為X軸，傷害/SP為Y軸）
        const calculateDualAxisTrendLines = (targetClass) => {
            const targetData = FULL_DATA.filter(d => d.class === targetClass && d.time > 0);
            if (targetData.length < 2) return null;

            // 傷害 vs 時間趨勢線（X=時間, Y=傷害）
            const damageTrend = calculateLinearRegression(targetData, 'time', 'damage');

            // SP vs 時間趨勢線（X=時間, Y=SP）
            const spData = targetData.filter(d => d.sp);
            const spTrend = spData.length >= 2 ? calculateLinearRegression(spData, 'time', 'sp') : null;

            return { damageTrend, spTrend };

        // 解析 CSV
        const parseAndProcessData = (csv) => {
            return csv.trim().split('\n').map((line, idx) => {
                const parts = line.split(',');
                const item = {
                    id: idx + 1,
                    class: parts[0],
                    level: parseInt(parts[1]) || 0,
                    trans: parts[2],
                    damage: parseInt(parts[3]) || 0,
                    skill: parts[4],
                    time: parseInt(parts[5]) || 0,
                    note: parts[6] || ""
                };

                const noteSP = item.note.match(/SP\s*(\d+)/i);
                const damageSP = line.match(/\(SP\s*(\d+)\)/i);
                item.sp = noteSP ? parseInt(noteSP[1]) : (damageSP ? parseInt(damageSP[1]) : null);

                if (item.time === 0) return { ...item, efficiency: 0 };
                return item;
            });
        };

        const FULL_DATA = parseAndProcessData(CSV_DATA);

        // 自訂圖表形狀
        const CustomShape = (props) => {
            const { cx, cy, fill, payload } = props;
            const isHighTier = payload.trans && (payload.trans.includes('金') || payload.trans.includes('青'));

            if (isHighTier) {
                return <path d={`M${cx},${cy - 6} L${cx + 6},${cy + 6} L${cx - 6},${cy + 6} Z`} fill={fill} stroke="#fff" strokeWidth={1} />;
            }
            return <circle cx={cx} cy={cy} r={5} fill={fill} stroke="#fff" strokeWidth={1} />;
        };



        const Overview = ({ onViewClass }) => {
            const [activeJob, setActiveJob] = useState(null);
            const [showTrendLines, setShowTrendLines] = useState(true);
            const [hoverPos, setHoverPos] = useState(null);
            const scalesRef = useRef(null);

            // 計算所有趨勢線
            const trendLines = useMemo(() => calculateAllTrendLines(), []);

            // 計算法師專用趨勢線
            const dualAxisTrendLines = useMemo(() => calculateDualAxisTrendLines(activeJob), [activeJob]);

                const times = FULL_DATA.filter(d => d.time > 0).map(d => d.time);
                const sps = FULL_DATA.filter(d => d.sp).map(d => d.sp);

                const xMax = Math.max(...damages) + 20;
                const yMax = Math.max(...times) + 5;

                const spMin = sps.length > 0 ? Math.min(...sps) - 10 : 80;
                const spMax = sps.length > 0 ? Math.max(...sps) + 10 : 200;

                return { xMin, xMax, yMax, spMin, spMax };
            }, []);

                            </div>

                        >

                        <a

                        >
                            <span className="w-2 h-2 bg-indigo-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(99,102,241,0.8)]"></span>

                                            <p className="mt-1">區塊說明：<span className="text-green-400 font-bold">● 極速區(&lt;15分)</span> / <span className="text-yellow-400 font-bold">● 穩定區(15-30分)</span> / <span className="text-red-400 font-bold">● 苦戰區(&gt;30分)</span></p>

                        <div className="h-[450px] w-full relative select-none">

                                    {!isDualAxisActive && <ReferenceArea xAxisId="damage" y1={30} y2={300} fill="#ef4444" fillOpacity={0.15} stroke="none" ifOverflow="extend" />}

                                    {isDualAxisActive && <ReferenceArea xAxisId="time" yAxisId="left" x1={15} x2={30} fill="#eab308" fillOpacity={0.1} stroke="none" ifOverflow="extend" />}

                                                        {d.sp && <p>SP：<span className="text-pink-400 font-bold">{d.sp}</span></p>}
                                                        <p>變身：<span className="text-slate-300">{d.trans}</span></p>
                                                        <p className="text-xs text-slate-500 pt-2 border-t border-slate-700 mt-2">{d.skill}</p>
                                                        {d.note && <p className="text-xs text-blue-400 italic">"{d.note}"</p>}
                                                    </div>
                                                </div>
                                            );
                                        }
                                        return null;
                                    }} />

                                    {isDualAxisActive && <Legend verticalAlign="top" height={36} />}

                                    {/* --- 1. 雙軸模式特殊渲染 (雙Y軸) --- */}
                                    {isDualAxisActive && (

                                            data={FULL_DATA.filter(d => d.class === activeJob && d.time > 0)}
                                            fill={COLORS[activeJob]}
                                            xAxisId="time"

                                            shape="circle"
                                        />
                                    )}
                                    {isDualAxisActive && (
                                        <Scatter
                                            name="SP (魔攻)"
                                            data={FULL_DATA.filter(d => d.class === activeJob && d.time > 0 && d.sp)}
                                            fill="#ec4899"
                                            xAxisId="time"
                                            yAxisId="right"
                                            shape="diamond"
                                        />
                                    )}
                                    {isDualAxisActive && showTrendLines && dualAxisTrendLines && dualAxisTrendLines.damageTrend && (
                                        <Scatter
                                            name="傷害趨勢"
                                            data={[
                                                { time: dualAxisTrendLines.damageTrend.startPoint.x, damage: dualAxisTrendLines.damageTrend.startPoint.y },
                                                { time: dualAxisTrendLines.damageTrend.endPoint.x, damage: dualAxisTrendLines.damageTrend.endPoint.y }

                                            fill="none"
                                            line={{ stroke: COLORS[activeJob], strokeWidth: 3, strokeDasharray: '8 4' }}

                                            data={[

                                            lineType="joint"
                                            legendType="none"
                                            xAxisId="time"

                                            shape={() => null}

                                </h4>
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    地龍懼怕地屬性，針對地屬性傷害、屬性爆擊加強可明顯提高傷害。另外，槍手、妖精也要使用有"貫通"效果的武器才不至導致傷害減半。
                                </p>
                            </div>
                            <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50">
                                <h4 className="text-lg font-bold text-white mb-3 flex items-center gap-2">
                                    <TrendingUpIcon className="text-blue-400" /> 2. 攻擊速度
                                </h4>
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    變身攻速直接影響效率，能覺醒盡量拚，收藏或能提高攻速的飾品(如：風龍水晶)也能強化或換上。
                                </p>
                            </div>
                            <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50">
                                <h4 className="text-lg font-bold text-white mb-3 flex items-center gap-2">
                                    <TargetIcon className="text-red-400" /> 3. 關鍵技能
                                </h4>
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    每個職業都有影響傷害的關鍵紅紫技，比如王族的勇猛(大師)、雷神的極限驅動...等等，朝這類技能著手能大幅提升效率。
                                </p>
                            </div>
                            <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50">
                                <h4 className="text-lg font-bold text-white mb-3 flex items-center gap-2">
                                    <AlertIcon className="text-amber-400" /> 4. 職業挑選
                                </h4>
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    上面極少數提供數據的職業，不要猶豫！避開就對了！選對職業少努力20年。
                                </p>
                            </div>
                        </div>

                        {/* 趨勢線與性價比解釋區塊 */}
                        {
                            showTrendLines && (
                                <div className="mt-8 bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-xl border border-amber-500/30 shadow-xl">
                                    <h4 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                                        <TrendingUpIcon className="text-amber-500" /> 趨勢線與性價比分析
                                    </h4>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                                        <div className="bg-slate-900/50 p-4 rounded-lg border-l-4 border-green-500">
                                            <h5 className="text-green-400 font-bold mb-2">📈 趨勢線解讀</h5>
                                            <ul className="text-slate-300 text-sm space-y-2">
                                                <li>• <span className="text-white font-bold">趨勢線位置越低</span>：該職業在相同傷害下，通關時間越短，<span className="text-green-400">性價比越高</span></li>
                                                <li>• <span className="text-white font-bold">趨勢線斜率越陡（向下）</span>：每增加一點傷害，時間減少越多，<span className="text-green-400">投資回報率越高</span></li>
                                                <li>• <span className="text-white font-bold">趨勢線越平</span>：傷害對時間影響較小，可能需要依賴技能或其他因素</li>
                                            </ul>
                                        </div>

                                        <div className="bg-slate-900/50 p-4 rounded-lg border-l-4 border-amber-500">
                                            <h5 className="text-amber-400 font-bold mb-2">💡 性價比指標</h5>
                                            <ul className="text-slate-300 text-sm space-y-2">
                                                <li>• <span className="text-white font-bold">高性價比職業</span>：趨勢線在「極速區」（綠色區域）穿過，代表低投入高回報</li>
                                                <li>• <span className="text-white font-bold">穩定型職業</span>：趨勢線斜率穩定，無論傷害高低都能完成通關</li>
                                                <li>• <span className="text-white font-bold">門檻型職業</span>：趨勢線離散度高，表示需要特定條件才能發揮效率</li>
                                            </ul>
                                        </div>
                                    </div>

                                    {/* 各職業趨勢線數據表 */}
                                    <div className="overflow-x-auto">
                                        <h5 className="text-slate-300 font-bold mb-3">📊 各職業效率指標排名</h5>
                                        <table className="w-full text-sm">
                                            <thead className="bg-slate-900 text-slate-400">
                                                <tr>
                                                    <th className="px-3 py-2 text-left">職業</th>
                                                    <th className="px-3 py-2 text-center">樣本數</th>
                                                    <th className="px-3 py-2 text-center">效率指標</th>
                                                    <th className="px-3 py-2 text-center">R²</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-700">
                                                {Object.entries(trendLines)
                                                    .sort((a, b) => b[1].rSquared - a[1].rSquared)
                                                    .map(([job, trend]) => {
                                                        const jobData = FULL_DATA.filter(d => d.class === job && d.time > 0);
                                                        const efficiencyLevel = trend.efficiency > 0.15 ? 'text-green-400' :
                                                            trend.efficiency > 0.08 ? 'text-yellow-400' : 'text-red-400';
                                                        return (
                                                            <tr key={job} className="hover:bg-slate-700/50">
                                                                <td className="px-3 py-2">
                                                                    <span className="inline-block w-3 h-3 rounded-full mr-2" style={{ backgroundColor: COLORS[job] }}></span>
                                                                    <span className="font-bold" style={{ color: COLORS[job] }}>{job}</span>
                                                                </td>
                                                                <td className="px-3 py-2 text-center text-slate-400">{jobData.length}</td>
                                                                <td className={`px-3 py-2 text-center font-bold ${efficiencyLevel}`}>
                                                                    {trend.efficiency.toFixed(2)} 分/100傷
                                                                </td>
                                                                <td className="px-3 py-2 text-center text-slate-400">
                                                                    {(trend.rSquared * 100).toFixed(0)}%
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                            </tbody>
                                        </table>
                                        <p className="text-slate-500 text-xs mt-2">
                                            * 效率指標 = 每增加100點傷害可減少的通關時間（分鐘）| R² = 趨勢線擬合度（越高表示數據越符合線性關係）
                                        </p>
                                    </div>
                                </div>
                            )
                        }

                    </div >
                </div >
            );
        };

        const ClassDetail = ({ className, onBack }) => {
            const data = useMemo(() => FULL_DATA.filter(d => d.class === className).sort((a, b) => a.damage - b.damage), [className]);
            const best = [...data].filter(d => d.time > 0).sort((a, b) => a.time - b.time)[0];
            const worst = [...data].filter(d => d.time > 0).sort((a, b) => b.time - a.time)[0];

            const getTimeColor = (time, bestTime, worstTime) => {
                if (time === 0) return 'text-red-600 font-black';
                if (time === bestTime) return 'text-green-400 font-black scale-110 inline-block drop-shadow-[0_0_8px_rgba(74,222,128,0.5)]';
                if (time === worstTime) return 'text-red-400 font-bold';
                if (time <= 15) return 'text-green-400 font-bold';
                if (time >= 40) return 'text-red-400 font-bold';
                return 'text-white font-medium';
            };

            const getAnalysis = () => {
                switch (className) {
                    case '法師': return {
                        verdict: 'Special Tier',
                        summary: '技能門檻極高。不能單純用面板傷害來衡量，必須具備「古代究光」等核心技能才能打出高效成績。',
                        key: '技能完整度決定一切。法師的機制特殊，無法直接與其他職業透過面板傷害進行橫向比較。',
                        trap: '沒有足夠的關鍵技能（如究光）與回魔支撐，千萬不要貿然挑戰。'
                    };
                    case '魔劍士': return {
                        verdict: 'C Tier',
                        summary: '中距離攻擊職業。數據顯示極端落差：260傷害白技打55分，紅技打27分。普攻係數低。',
                        key: '傷害完全來自技能堆疊。',
                        trap: '雖為中距離，但沒紅技進場就是坐牢，千萬別用白技打。'
                    };
                    case '龍鬥': return {
                        verdict: 'B- Tier',
                        summary: '中距離攻擊職業。表現不穩，有雙金技打42分的案例，也有9分鐘的極速紀錄。',
                        key: '弱點曝光疊加的穩定性。',
                        trap: '操作上下限差距極大，需長時間暖機。'
                    };
                    case '死神': return {
                        verdict: 'A Tier',
                        summary: '中距離攻擊職業。數據顯示高傷(345)下效率極佳(13分)，輸出節奏明快。',
                        key: '技能全滿與商城紫技的加持。',
                        trap: '目前樣本多為頂規機體，中低階機體表現待驗證。'
                    };
                    case '槍手': return { verdict: 'S Tier', summary: '遠程之星。數據驗證：194傷害紫變(15分)完勝250傷害金變(30分)。', key: '遠攻優勢與紅紫技完整度。槍手在低面板下依然能靠技能打出高效率。', trap: '87等金變案例顯示，等級與技能若不全，金變也救不了。' };
                    case '聖劍': return { verdict: 'S+ Tier', summary: '新任CP值王者。數據顯示：只需178面板傷害(金變)即可在13分鐘通關，面板門檻為全職業最低。', key: '物理傷害與SP(魔攻)雙向增益，屬性互補性極強。', trap: '極度依賴技能組合，若核心紅技不足，通關時間會倍增。' };
                    case '雷神': return { verdict: 'A Tier', summary: '下限極高。即使只有 196 傷害也能磨死地龍 (30分)。', key: '血盟獨特紫技「極限驅動」提供了穩定的被動輸出。', trap: '無明顯陷阱，耐心磨必過，極限驅動，潛能無限。' };
                    case '王族': return { verdict: 'Budget King', summary: '只需兩本紅技(勇猛意志+大師)即可穩定通關，養成成本最低。', key: '「勇猛意志」提供穩定攻速，無需任何紫技也能單挑。', trap: '需有耐心，打得慢不是打不過。' };
                    case '黑妖': return { verdict: 'Risk Tier', summary: '極速傳說 (8分鐘)，但生存壓力巨大。', key: '「夢魘」生存技與「破壞盔甲」爆發技缺一不可。', trap: '機體不夠硬且沒夢魘，進場即死亡。' };
                    case '騎士': return { verdict: 'Odd Tier', summary: '反直覺：300傷紫變需45分，230傷金變僅需27分。', key: '金技/覺醒效果可能遠大於面板傷害。', trap: '高傷紫變效率極低，需特別注意技能配置。' };
                    case '暗騎': return { verdict: 'B Tier', summary: '樣本較少，目前 238 傷害需 45 分，效率中下。', key: '需更多高階機體數據驗證。', trap: '目前數據顯示低傷效率不佳。' };
                    default: return { verdict: '標準型', summary: '效率隨傷害線性提升。', key: '紅紫技完整度。', trap: '高傷害若配白技效率依然低落。' };
                }
            };
            const analysis = getAnalysis();

            return (
                <div className="space-y-6 animate-fade-in pb-12">
                    <button onClick={onBack} className="flex items-center text-slate-400 hover:text-white gap-1 group transition-colors"><BackIcon size={18} className="group-hover:-translate-x-1 transition-transform" />返回總覽</button>

                    <div className="bg-slate-800 rounded-xl p-8 border border-slate-700 shadow-xl">
                        <div className="flex flex-col md:flex-row justify-between gap-6 mb-8">
                            <div>
                                <h2 className="text-4xl font-black text-white" style={{ color: COLORS[className] }}>{className}</h2>
                                <div className="mt-3 flex gap-3"><span className="px-3 py-1 bg-slate-700 rounded-full text-sm font-bold border border-slate-600">{analysis.verdict}</span></div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1">
                                <div className="bg-slate-900/50 p-4 rounded-lg border-l-4 border-blue-500">
                                    <h4 className="text-blue-400 font-bold mb-1 flex items-center gap-2"><InfoIcon size={16} />數據總結</h4>
                                    <p className="text-slate-300 text-sm">{analysis.summary}</p>
                                </div>
                                <div className="bg-slate-900/50 p-4 rounded-lg border-l-4 border-amber-500">
                                    <h4 className="text-amber-400 font-bold mb-1 flex items-center gap-2"><TargetIcon size={16} />關鍵變因</h4>
                                    <p className="text-slate-300 text-sm">{analysis.key}</p>
                                </div>
                                <div className="bg-slate-900/50 p-4 rounded-lg border-l-4 border-red-500">
                                    <h4 className="text-red-400 font-bold mb-1 flex items-center gap-2"><AlertIcon size={16} />避坑指南</h4>
                                    <p className="text-slate-300 text-sm">{analysis.trap}</p>
                                </div>
                            </div>
                        </div>

                        {best && worst && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div className="bg-gradient-to-br from-green-900/30 to-slate-900 border border-green-500/30 p-6 rounded-xl shadow-lg relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-24 h-24 bg-green-500/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                                    <div className="flex items-center justify-between mb-4 border-b border-green-500/20 pb-2">
                                        <span className="text-green-400 text-sm font-bold uppercase tracking-wider flex items-center gap-2"><ZapIcon size={16} /> 最高效率 (Best Run)</span>
                                        <span className="text-3xl font-black text-white">{best.time} <span className="text-sm font-normal text-slate-400">分</span></span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-y-3 text-sm">
                                        <div><span className="text-slate-500 text-xs block">機體傷害</span><span className="text-white font-bold text-lg">{best.damage}</span></div>
                                        <div><span className="text-slate-500 text-xs block">變身等級</span><span className="text-white">{best.trans}</span></div>
                                        <div className="col-span-2"><span className="text-slate-500 text-xs block">技能配置</span><span className="text-slate-300">{best.skill}</span></div>
                                        <div className="col-span-2"><span className="text-slate-500 text-xs block">關鍵備註</span><span className="text-green-300">{best.note || '無'}</span></div>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-br from-red-900/30 to-slate-900 border border-red-500/30 p-6 rounded-xl shadow-lg relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-24 h-24 bg-red-500/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                                    <div className="flex items-center justify-between mb-4 border-b border-red-500/20 pb-2">
                                        <span className="text-red-400 text-sm font-bold uppercase tracking-wider flex items-center gap-2"><AlertIcon size={16} /> 最低效率 (Worst Run)</span>
                                        <span className="text-3xl font-black text-white">{worst.time === 0 ? '失敗' : worst.time} <span className="text-sm font-normal text-slate-400">{worst.time === 0 ? '' : '分'}</span></span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-y-3 text-sm">
                                        <div><span className="text-slate-500 text-xs block">機體傷害</span><span className="text-white font-bold text-lg">{worst.damage}</span></div>
                                        <div><span className="text-slate-500 text-xs block">變身等級</span><span className="text-white">{worst.trans}</span></div>
                                        <div className="col-span-2"><span className="text-slate-500 text-xs block">技能配置</span><span className="text-slate-300">{worst.skill}</span></div>
                                        <div className="col-span-2"><span className="text-slate-500 text-xs block">關鍵備註</span><span className="text-red-300">{worst.note || '無'} {className === '雷神' ? ' 極限驅動，潛能無限' : ''}</span></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="overflow-x-auto rounded-xl border border-slate-700">
                            <table className="w-full text-left text-sm text-slate-300">
                                <thead className="bg-slate-900 text-xs text-slate-400 uppercase">
                                    <tr><th className="px-4 py-3">編號</th><th className="px-4 py-3">等級</th><th className="px-4 py-3">變身</th><th className="px-4 py-3">傷害</th><th className="px-4 py-3">技能</th><th className="px-4 py-3">備註</th><th className="px-4 py-3 text-right">時間</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {data.map(row => (
                                        <tr key={row.id} className="hover:bg-slate-700/50">
                                            <td className="px-4 py-3 text-slate-500">#{row.id}</td>
                                            <td className="px-4 py-3">{row.level}</td>
                                            <td className="px-4 py-3">{row.trans}</td>
                                            <td className="px-4 py-3 font-bold text-white">{row.damage}</td>
                                            <td className="px-4 py-3 text-xs text-slate-400 max-w-[200px] truncate" title={row.skill}>{row.skill}</td>
                                            <td className="px-4 py-3 text-xs text-slate-500 max-w-[150px] truncate" title={row.note}>{row.note}</td>
                                            <td className={`px-4 py-3 text-right font-mono ${getTimeColor(row.time, best?.time, worst?.time)}`}>
                                                {row.time === 0 ? '失敗' : `${row.time}m`}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('overview');
            const [selectedClass, setSelectedClass] = useState('槍手');
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const handleClassSelect = (job) => { setView('detail'); setSelectedClass(job); setIsMenuOpen(false); window.scrollTo(0, 0); };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 font-sans">
                    <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-xl">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('overview')}>
                                <div className="bg-gradient-to-br from-indigo-600 to-purple-700 p-2 rounded-lg shadow-lg"><ShieldIcon size={24} className="text-white" /></div>
                                <h1 className="text-lg font-bold text-white tracking-tight hidden sm:block">天堂M 地龍單挑<span className="text-amber-500">終極</span>分析</h1>
                            </div>
                            <div className="hidden md:flex gap-1 overflow-x-auto px-4 no-scrollbar">
                                <button onClick={() => setView('overview')} className={`px-3 py-2 rounded-md text-sm font-medium transition-all ${view === 'overview' ? 'text-amber-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>總覽</button>
                                {ALL_CLASSES.map(job => (
                                    <button key={job} onClick={() => handleClassSelect(job)} className={`px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap transition-all ${view === 'detail' && selectedClass === job ? 'text-amber-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>{job}</button>
                                ))}
                            </div>
                            <div className="md:hidden"><button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 text-slate-400 hover:text-white transition-colors">{isMenuOpen ? <CloseIcon /> : <MenuIcon />}</button></div>
                        </div>
                        {isMenuOpen && (
                            <div className="md:hidden bg-slate-900 border-t border-slate-800 absolute w-full shadow-2xl z-50 p-4 grid grid-cols-3 gap-2">
                                <button onClick={() => { setView('overview'); setIsMenuOpen(false); }} className="col-span-3 py-3 bg-slate-800 rounded-lg text-amber-500 font-bold mb-2">返回總覽</button>
                                {ALL_CLASSES.map(job => (
                                    <button key={job} onClick={() => handleClassSelect(job)} className="py-2 bg-slate-800/50 rounded-lg text-xs text-slate-300">{job}</button>
                                ))}
                            </div>
                        )}
                    </nav>
                    <main className="max-w-7xl mx-auto px-4 py-8 min-h-screen">
                        {view === 'overview' ? <Overview onViewClass={handleClassSelect} /> : <ClassDetail className={selectedClass} onBack={() => setView('overview')} />}
                    </main>
                    <footer className="bg-slate-900 border-t border-slate-800 py-12">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-slate-500 text-sm">數據來源：所有數據階取自玩家回報，分析僅供參考 (2025年12月)</p>
                            <div className="mt-8 flex justify-center">
                                <a
                                    href="https://www.youtube.com/@bandonplay"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-2 px-5 py-2.5 bg-amber-600/10 hover:bg-amber-600/20 text-amber-500 rounded-xl text-base font-black tracking-wider transition-all border border-amber-500/30 group shadow-lg hover:shadow-amber-500/10"
                                >
                                    <span className="w-2 h-2 bg-amber-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(245,158,11,0.8)]"></span>
                                    資料整理製作：編董不雷
                                    <ExternalLinkIcon size={18} className="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" />
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
